<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comment Section</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .comment-section {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 5px;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    form button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    form button:hover {
      background: #0056b3;
    }

    .comment {
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    .comment h4 {
      margin: 0;
    }

    .comment p {
      margin: 5px 0 0;
    }
  </style>
</head>
<body>
  <a href="sign in.html">Become our #1 customer</a>
  
<div class="comment-section">
  <h2>Comments</h2>
  <form id="comment-form">
    <input type="text" id="username" placeholder="Your name" required />
    <textarea id="comment" placeholder="Your comment" required></textarea>
    <button type="submit">Post Comment</button>
  </form>
  <div id="comments-list"></div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("comment-form");
    const commentList = document.getElementById("comments-list");

    // Load saved comments
    const savedComments = JSON.parse(localStorage.getItem("comments")) || [];

    function displayComments() {
      commentList.innerHTML = "";
      savedComments.forEach(comment => {
        const div = document.createElement("div");
        div.className = "comment";
        div.innerHTML = `<h4>${comment.name}</h4><p>${comment.text}</p>`;
        commentList.appendChild(div);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("username").value.trim();
      const text = document.getElementById("comment").value.trim();

      if (name && text) {
        const newComment = { name, text };
        savedComments.push(newComment);
        localStorage.setItem("comments", JSON.stringify(savedComments));
        displayComments();
        form.reset();
      }
    });
document.getElementById("clear-comments").addEventListener("click", function () {
  if (confirm("Are you sure you want to delete all comments?")) {
    localStorage.removeItem("comments");
    location.reload(); // Refresh the page to update the view
  }
});
   
  });



</script>


<button id="clear-comments">Clear All Comments</button>
</body>
</html>
