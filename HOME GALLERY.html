<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electric Web</title>
  <style>

    .slider {
  width: 500px;       /* Adjust size */
  height: 300px;
  overflow: hidden;
  position: relative;
}

.slides {
  display: flex;
  width: 1500px;      /* 3 images × 500px width */
  animation: slide 9s infinite;
}

.slides img {
  width: 500px;
  height: 300px;
}

@keyframes slide {
  0%   { transform: translateX(0); }
  33%  { transform: translateX(-500px); }
  66%  { transform: translateX(-1000px); }
  100% { transform: translateX(0); }
}
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .image-section {
      height: 100vh;
      background: url('Electric web Logo 2.png') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
    }

    .image-section .content {
      padding: 50px;
      color: white;
    }

    .image-section h1 {
      font-size: 3rem;
    }

    .image-section p {
      font-size: 1.2rem;
      max-width: 600px;
    }

    .next-section {
      padding: 60px 20px;
      background-color: #f2f2f2;
    }

    .vertical-menu {
  width: 200px; /* Set a width if you want */
  background-color: #f1f1f1;
  padding: 0;
  border: 1px solid #ccc;
}

.vertical-menu a {
  display: block;               /* Makes links appear one below the other */
  color: black;
  padding: 12px;
  text-decoration: none;
  transition: background 0.3s;
}

.vertical-menu a:hover {
  background-color: greenyellow;
}

.vertical-menu a.active {
  background-color: #04AA6D;
  color: white;
}

  </style>
</head>
<body>

    

  <!-- Section with image as background, content sits inside it -->
  <section class="image-section">
    <div class="slider">
  <div class="slides">
    <img src="MAN.jpg">
    <img src="family.jpg">
     <img src="20.jpg">
    <img src="person.jpg">
  
  </div>
</div>

</div>

  </section>

</body>
</html>
